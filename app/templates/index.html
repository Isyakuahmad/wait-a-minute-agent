<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Piggy Bank That Says Wait a Minute</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 18px;background:#f3f6f3;color:#17211b}.card{background:white;padding:24px;border:1px solid #dce5dd;border-radius:16px}h1{color:#14532d}label{display:block;margin:14px 0 6px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bdcbbf;border-radius:8px;font:inherit}button{margin-top:18px;padding:12px 18px;background:#166534;color:white;border:0;border-radius:8px;font-weight:700}.result{white-space:pre-wrap;background:#f0f5f0;padding:14px;margin-top:16px;border-radius:8px}</style></head>
<body><main class="card"><h1>The Piggy Bank That Says Wait a Minute</h1><p>Suspicious transaction proposals pause for human approval.</p><form id="tx"><label>Recipient</label><input name="recipient" value="unknown-seller.testnet" required><label>Amount (NEAR)</label><input name="amount" type="number" min="0.000000000000000000000001" step="any" value="150" required><label>Intended amount (NEAR)</label><input name="intended_amount" type="number" min="0.000000000000000000000001" step="any" value="10" required><label>Reason</label><input name="intent" value="Purchase demo item" required><button>Evaluate transaction</button></form><div id="result" class="result" hidden></div><p>Demo only: no wallet signing or NEAR transfers are enabled.</p></main><script>
document.querySelector('#tx').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const payload={request_id:crypto.randomUUID(),agent_id:'demo-agent',recipient:f.get('recipient'),amount:f.get('amount'),intended_amount:f.get('intended_amount'),asset:'NEAR',network:'testnet',intent:f.get('intent')};const box=document.querySelector('#result');box.hidden=false;box.textContent='Evaluating…';try{const r=await fetch('/api/transactions/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});box.textContent=JSON.stringify(await r.json(),null,2)}catch(err){box.textContent='Request failed: '+err}});
</script></body></html>
